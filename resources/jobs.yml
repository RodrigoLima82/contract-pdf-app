# Databricks Jobs Configuration - Contract Extract App
# 
# Este arquivo define o job de processamento de contratos:
# - Pipeline de processamento - trigger por chegada de arquivos
#
# IMPORTANTE: 
# - Tabelas são criadas pelo script de setup (setup.py)
# - O job processa PDFs que chegam no Volume automaticamente
#
# Nota: Use setup.py para criar tabelas, volume e configurar o ambiente

resources:
  jobs:
    # ============================================================
    # PIPELINE DE PROCESSAMENTO DE CONTRATOS
    # Processa PDFs que chegam no Volume (parse + extração com LLM)
    # ============================================================
    
    contracts_extract:
      name: contracts-extract-${bundle.target}
      
      # Trigger automático quando PDFs chegam no Volume
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog_name}/${var.schema_name}/files/
          # Esperar 60 segundos entre triggers para evitar execuções duplicadas
          # quando múltiplos arquivos chegam quase ao mesmo tempo
          min_time_between_triggers_seconds: 60
      
      # Permitir apenas 1 execução por vez para evitar conflitos
      max_concurrent_runs: 1
      
      queue:
        enabled: true
      
      parameters:
        - name: warehouse_id
          default: ${var.warehouse_id}
      
      # Serverless compute: sem job_clusters → Databricks usa serverless por padrão
      # (notebook/Python tasks). Ver: docs.databricks.com/en/jobs/run-serverless-jobs
      tasks:
        # Task 1: Rastrear novos PDFs no Volume
        - task_key: track_pdfs
          notebook_task:
            notebook_path: ../jobs/1_track_pdfs.py
            base_parameters:
              catalog: ${var.catalog_name}
              database: ${var.schema_name}
              volume_path: /Volumes/${var.catalog_name}/${var.schema_name}/files
            source: WORKSPACE
        
        # Task 2: Listar arquivos que chegaram
        - task_key: list_files
          depends_on:
            - task_key: track_pdfs
          notebook_task:
            notebook_path: ../jobs/2_list_files.py
            base_parameters:
              catalog: ${var.catalog_name}
              database: ${var.schema_name}
              table: contract_track
            source: WORKSPACE
        
        # Task 3: Parse e extração (para cada arquivo)
        - task_key: parse_and_extract
          depends_on:
            - task_key: list_files
          for_each_task:
            inputs: "{{tasks.list_files.values.arrival_files}}"
            concurrency: 1
            task:
              task_key: process_pdf
              notebook_task:
                notebook_path: ../jobs/3_parse_extract.sql
                base_parameters:
                  catalog: ${var.catalog_name}
                  database: ${var.schema_name}
                  extractTableName: contract_extract
                  templateTableName: contract_template
                  complianceTableName: contract_compliance
                  file_path: "{{input}}"
                  parsedTableName: contract_parsed
                  sourcePDFPath: /Volumes/${var.catalog_name}/${var.schema_name}/files
                  trackTableName: contract_track
                source: WORKSPACE
      
      tags:
        app: contract-extract
        pipeline: document-processing
        target: ${bundle.target}
