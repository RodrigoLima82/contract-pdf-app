# Databricks Apps configuration via DABS
# https://docs.databricks.com/en/dev-tools/bundles/resources.html#apps
resources:
  apps:
    contract_extract:
      name: contract-extract-${bundle.target}
      description: "AI-powered contract information extraction application"
      source_code_path: ../app
      
      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE
